name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sim:
    name: simulation core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck
        run: npx --yes typescript@5.6 tsc --noEmit
      - name: Test
        run: node --test --experimental-strip-types "test/**/*.test.ts"
